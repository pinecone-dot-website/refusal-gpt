# SMOKE config — pipeline validation only, NOT a model.
#
# 35 training rows, all by="claude", zero amplified. At batch 4 that is ~9 steps
# per epoch, so even 60 iters is ~7 epochs. The expected outcome is a collapsed
# model that emits one or two lines forever. That is fine. What this run is
# testing is that the plumbing works end to end before real data exists:
#
#   config schema parses (num_layers + nested lora_parameters, NOT lora_layers)
#   -> mask_prompt accepted
#   -> data/mlx/{train,valid}.jsonl load
#   -> loss goes down
#   -> adapter saves
#   -> generation with the adapter produces refusals rather than Qwen being helpful
#
# Base is the 4-bit MLX build because it was already on disk. The real run uses
# fp16 (runs/config.yaml) — MLX->GGUF from a quantized base drops the fine-tune,
# see CLAUDE.md. Do not ship anything trained from this config.

model: "mlx-community/Qwen2.5-7B-Instruct-4bit"
train: true
data: "./data/mlx"
adapter_path: "./runs/adapters-smoke"

num_layers: 16
lora_parameters:
  rank: 16
  dropout: 0.05
  scale: 20.0

batch_size: 4
iters: 60
learning_rate: 1.0e-5
grad_checkpoint: false
max_seq_length: 1024

mask_prompt: true

steps_per_eval: 20
steps_per_report: 10
val_batches: 3          # only 15 valid rows exist
save_every: 10          # NOT steps_per_save — silently ignored
