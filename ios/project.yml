# xcodegen spec. The .xcodeproj is a BUILD PRODUCT and is gitignored —
# regenerate with `xcodegen generate` from ios/.
#
# A generated project means no 4,000-line project.pbxproj in review, and no
# merge conflicts in a file nobody can read.
name: RefusalGPT
options:
  bundleIdPrefix: cyou.refusalgpt
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  RefusalKit:
    path: RefusalKit

targets:
  RefusalGPT:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: RefusalKit
        product: RefusalKit
      - package: RefusalKit
        product: RefusalLlama
    settings:
      base:
        # The model is downloaded, not bundled, so the app itself stays small.
        # A 1.2 GB bundle would blow past the App Store cellular limit and make
        # every install a hostage situation.
        PRODUCT_BUNDLE_IDENTIFIER: cyou.refusalgpt.app
        DEVELOPMENT_TEAM: EKNXJ2NR3G
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Universal, because the dev workflow now lives on an iPad: the debug
        # panel is a permanent right-hand column there, not a sheet.
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: RefusalGPT
        UILaunchScreen: {}
        # iPhone stays portrait — one-hand chat. iPad is landscape-only and
        # full-screen: the split (chat left, debug right) needs the width and a
        # guaranteed regular size class, so multitasking is off.
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
