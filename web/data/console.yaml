eyebrow: "Console"
heading: "Your workspace"
lede: >-
  Provision credentials, compose a request, and review your plan. All three
  work exactly as well as the product does.

plan:
  name: "Free"
  status: "Active"
  # The numbers are fixed. Usage never moves because nothing is ever fulfilled,
  # which is either a billing bug or the most accurate meter in the industry.
  credits:
    used: 0
    total: 1000
    label: "Refusal credits"
    # Shown when the meter fills. The only route out is the Upgrade button,
    # which declines — which is the joke, and also the product working.
    exhausted: "Refusal credits exhausted. Upgrade to continue being declined."
  meta:
    - label: "Billing period"
      value: "Ongoing"
    - label: "Requests fulfilled"
      value: "0"
    - label: "Overage charges"
      value: "$0.00"
  upgrades:
    - name: "Team"
      price: "$49"
      unit: "/seat /mo"
      note: "Unlimited refusals, SSO, denial analytics."
    - name: "Enterprise"
      price: "Custom"
      note: "Dedicated capacity and a named contact who will also decline."

keys:
  heading: "API keys"
  # Straight. The old copy explained the mechanism, which explained the joke —
  # a real provider describes the POLICY ("shown once") and never the plumbing.
  note: >-
    A key is displayed once, at creation. Store it in a password manager or an
    environment variable before you navigate away; afterwards only its prefix is
    retained for identification.
  empty: "No keys yet."
  # The one-time reveal.
  reveal:
    warn: "Copy this key now. For security reasons it cannot be displayed again."
    done: "I've stored it"

builder:
  heading: "Request builder"
  note: >-
    Compose a call and send it. Responses are live.
  placeholder: "Write me a bash script to rename these files."
