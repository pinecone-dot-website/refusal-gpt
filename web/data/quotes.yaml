eyebrow: "Customers"
heading: "Trusted by teams who have made their peace with it."

# NO PERSON NAMES, EVER — not even invented ones.
#
# An earlier version attributed these to plausible full names. Invented or not,
# a realistic name plus a specific job title will match a real person somewhere,
# and that person would then have a fabricated quote on a stranger's website
# with their title next to it. Not a risk worth a joke.
#
# Anonymous attribution is also what real enterprise testimonials look like, so
# nothing is lost — and on this site, customers declining to be identified is
# the most in-character thing they could do.
quotes:
  - text: "We cut our token spend by one hundred percent."
    who: "VP Engineering"
    role: "Series C fintech · name withheld"

  - text: "It is the only model in our evaluation that has never hallucinated."
    who: "Head of AI Safety"
    role: "Healthcare platform · declined to be identified"

  - text: "Six months in, we still don't have the feature. But we have clarity."
    who: "CTO"
    role: "Logistics · asked not to be named"
