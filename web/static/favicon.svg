<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="RefusalGPT">
  <!--
    The site's brand mark: a circle struck through. Same glyph as the CSS .mark
    in the nav, drawn filled rather than as a ring.

    Filled, not outlined, on purpose. A 2px ring with a 2px slash is elegant at
    17px in the header and turns to mush at 16px in a tab strip. A solid disc
    holds its shape at any size and carries its own background, which is also
    what makes one asset work on both a white and a near-black tab bar without
    a prefers-color-scheme dance that Safari would ignore anyway.

    Amber (the site's accent, #C8791A) rather than ink: ink disappears on a dark tab
    bar, and amber is the accent the whole site already reads as. It also makes
    the thing look like a road sign, which for this product is accurate.
  -->
  <circle cx="16" cy="16" r="15" fill="#C8791A"/>
  <!-- The strike, matching the nav mark's direction (a "/" — CSS rotate(-45deg)). -->
  <path d="M9.5 22.5 L22.5 9.5" stroke="#FAFAF8" stroke-width="5" stroke-linecap="round"/>
</svg>
